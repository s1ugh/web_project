<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
  <link rel="stylesheet" href="style/login.css">
</head>
<body>
<div class="container">
  <div class="container_registration">
    <div class = "container_registration_txt">
      <p class="registration">
        <a href="registration.html">РЕГИСТРАЦИЯ</a>
      </p>
      <p class="login">
        <a href="login.html">ВХОД</a>
      </p>
    </div>
    <form action="ERROR.html" method="POST" class="container_registration_form">
      <input type="email" name="user_email"  placeholder="Email"><br>
      <input type="password" name="user_password" placeholder="Пароль"><br>
      <button>ВХОД</button>
    </form>
    <div class="separator">
      <span>или войдите через</span>
    </div>
    <div class="social-registration">
      <a href="https://www.google.com/intl/ru/account/about/" class="social-icon google">Google</a>
      <a href="https://web.telegram.org/k/" class="social-icon telegram">Telegram</a>
      <a href="https://www.facebook.com/?locale2=ru_RU&_rdr" class="social-icon facebook">Facebook</a>
    </div>
  </div>
</div>
<footer>
  <div class="footer_main">
    <div class="footer_logo">
      <p><b>GORIL<br>BLIN</b></p>
    </div>
    <div class="footer_txt_info">
      <div class = "footer_txt_info_rest">
        <p class="footer_txt">О ресторане</p>
        <a href="GORILBLIN.html"><p>Главная</p></a>
        <a href="menu.html"><p>Меню</p></a>
        <p>Доставка</p>
        <p>Другое</p>
      </div>
      <div class = "footer_txt_info_service">
        <p class="footer_txt">Сервис</p>
        <p>Центр помощи</p>
      </div>
      <div class = "footer_txt_info_support">
        <p class="footer_txt">Поддержка</p>
        <p>FAQs</p>
        <p>Центр поддержки</p>
        <p>Контакты</p>
      </div>
    </div>
  </div>
  <div class="footer_info_social_media">
    <div class="footer_social_line"></div>
    <div class="footer_social_icons">
      <a href="https://web.whatsapp.com/"><img src="image/Vector.png" alt="WhatsApp"></a>
      <a href="https://web.telegram.org/k/"><img src="image/tg.png" alt="Telegram"></a>
      <a href="https://x.com/home?lang=ru"><img src="image/x.png" alt="Twitter"></a>
      <a href="https://www.facebook.com/"><img src="image/facebook.png" alt="Facebook"></a>
    </div>
    <div class="footer_social_line"></div>
  </div>
</footer>
</body>
</html>
